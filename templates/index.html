<!DOCTYPE html>
<html>
<head>
    <title>Fake News Detector</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>📰 Fake News Detector for Students</h1>
        
        <form method="POST">
            <textarea
                name="article"
                rows="12"
                placeholder="Paste News Article Here..."
                required></textarea>
            <button type="submit">Analyze News</button>
        </form>

        {% if result %}
        <div class="result">
            <h2>Result</h2>
            <pre>{{ result }}</pre>
        </div>
        {% endif %}
    </div>
</body>
</html>
